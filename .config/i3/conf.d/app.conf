# i3 - apps.config

# Autostart always
exec_always --no-startup-id autorandr -c

# Autostart once
exec --no-startup-id xss-lock --transfer-sleep-lock -- i3lock --color '#000000' --nofork
exec --no-startup-id hsetroot -solid black
exec --no-startup-id parcellite --no-icon
exec --no-startup-id playerctld daemon
exec --no-startup-id unclutter

exec --no-startup-id fcitx5
exec --no-startup-id blueman-applet
exec --no-startup-id nm-applet
exec --no-startup-id gammastep-indicator -P

exec --no-startup-id "${XDG_DATA_HOME}/desktop/autostart"

# App key bind
bindcode --release $mod+$d exec --no-startup-id dmenu_run -i
bindcode --release $mod+$return exec --no-startup-id "${TERMINAL}"
bindcode --release $mod+$w exec --no-startup-id "${BROWSER}"
bindcode --release $print exec --no-startup-id "${SCREENSHOT}"
bindcode --release $mod+$p exec --no-startup-id "${PDFREADER}"
bindcode --release $mod+$m exec --no-startup-id "${EMAIL}"
bindcode --release $mod+$n exec --no-startup-id "${RSSFEED}"
bindcode --release $mod+$e exec --no-startup-id "${FILEMANAGER}"
bindcode --release $mod+Shift+$v exec --no-startup-id pavucontrol
bindcode --release $mod+Shift+$b exec --no-startup-id blueman-manager
bindcode --release $mod+Shift+$w exec --no-startup-id "${PRIVATE_BROWSER}"
bindcode --release $mod+$s [instance="terminal_scratchpad"] scratchpad show; \
																			exec --no-startup-id sh -c "pgrep -xf '${TERMINAL_SCRATCHPAD}' || ${TERMINAL_SCRATCHPAD}"
